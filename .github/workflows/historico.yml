name: Carga del histórico (Bluesky)

# Se lanza a mano desde la pestaña Actions. Conviene ir de a un trimestre
# para no pasar el límite de 6 horas por job. Si se corta, lo ya recolectado
# se guarda igual (el paso de guardado corre siempre) y se puede retomar.

on:
  workflow_dispatch:
    inputs:
      desde:
        description: "Desde (AAAA-MM-DD, incluido)"
        required: true
      hasta:
        description: "Hasta (AAAA-MM-DD, incluido)"
        required: true

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Recolectar ${{ inputs.desde }} a ${{ inputs.hasta }}
        run: python scripts/recolectar_bluesky.py --desde "${{ inputs.desde }}" --hasta "${{ inputs.hasta }}"

      - name: Guardar datos en el repo
        if: always()
        run: |
          git config user.name "scheffan"
          git config user.email "99194091+scheffan@users.noreply.github.com"
          git add data/bluesky
          if git diff --cached --quiet; then echo "Sin datos nuevos"; exit 0; fi
          git commit -m "Datos Bluesky: histórico ${{ inputs.desde }} a ${{ inputs.hasta }}"
          git pull --rebase
          git push
