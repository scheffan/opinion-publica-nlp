name: Recolección semanal (Bluesky)

on:
  schedule:
    - cron: "23 10 * * 1"   # lunes 07:23 hora argentina: trae lunes a domingo anteriores
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Recolectar la semana anterior
        run: python scripts/recolectar_bluesky.py --semana-anterior

      - name: Guardar datos en el repo
        if: always()
        run: |
          git config user.name "scheffan"
          git config user.email "99194091+scheffan@users.noreply.github.com"
          # Fusiona con lo último de main en vez de hacer rebase de archivos binarios
          mkdir -p /tmp/nuevos/registro
          git add data/bluesky
          for f in $(git diff --cached --name-only -- data/bluesky); do
            cp "$f" "/tmp/nuevos/${f#data/bluesky/}"
          done
          git fetch origin main
          git reset --hard origin/main
          python scripts/fusionar_datos.py /tmp/nuevos data/bluesky
          git add data/bluesky
          if git diff --cached --quiet; then echo "Sin datos nuevos"; exit 0; fi
          git commit -m "Datos Bluesky: semana $(TZ=America/Argentina/Buenos_Aires date -d '7 days ago' +%G-W%V)"
          git push
